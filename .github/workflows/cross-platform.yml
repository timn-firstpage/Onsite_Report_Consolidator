name: Windows and macOS

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            python: '3.10'
          - os: windows-latest
            python: '3.12'
          - os: macos-15-intel
            python: '3.10'
          - os: macos-latest
            python: '3.12'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - name: Install complete runtime dependencies
        run: python -m pip install -r requirements.txt
      - name: Check runtime and template image support
        run: python scripts/consolidate.py doctor
      - name: Test mapping, native paths, CLI, images and output publication
        run: python -m unittest discover -s tests -v
